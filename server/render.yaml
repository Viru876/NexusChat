services:
  - type: web
    name: nexuschat-server
    runtime: node
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_EXPIRE
        value: 7d
      - key: DATABASE_URL
        fromDatabase:
          name: nexuschat-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://nexuschat-viru876.vercel.app

databases:
  - name: nexuschat-db
    databaseName: nexuschat
    user: nexuschat
    plan: free
